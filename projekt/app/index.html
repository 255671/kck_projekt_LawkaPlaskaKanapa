<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Prototype</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    
    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .camera-section {
      flex: 2;
      display: flex;
      flex-direction: column;
    }

    .text-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #camera {
      width: 100%;
      height: auto;
      border: 3px solid #333;
      border-radius: 8px;
      background-color: #000;
      transition: all 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    #speech-output {
      width: 100%;
      height: 250px;
      resize: none;
      padding: 10px;
      font-size: 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    #output {
      max-height: 150px;
      overflow-y: auto;
      background: #eaeaea;
      padding: 10px;
      border-radius: 5px;
    }

    button {
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    button:hover { background-color: #0056b3; }

    #toggle-camera-btn {
      background-color: #6c757d;
    }
    #toggle-camera-btn:hover {
      background-color: #5a6268;
    }

  </style>
</head>
<body>

<h1><b>Wirtualny trener</b></h1>

  <div class="container">

    <div class="camera-section">
      <img id="camera" class="hidden"/>
      <pre id="output"></pre>
    </div>

    <div class="text-section">
      <button id="toggle-camera-btn">Pokaż kamerę</button>

      <button id="speak-btn" style="background-color: #28a745;">Powiedz "Hello"</button>
      <button id="listen-btn">Nasłuchuj komendy</button>
      <textarea id="speech-output" readonly placeholder="Rozpoznany tekst pojawi się tutaj..."></textarea>
    </div>
  </div>

  <script src="renderer.js"></script>

  <script>
    const toggleCameraBtn = document.getElementById('toggle-camera-btn');
    const cameraElement = document.getElementById('camera');

    toggleCameraBtn.addEventListener('click', () => {
      if (cameraElement.classList.contains('hidden')) {
        cameraElement.classList.remove('hidden');
        toggleCameraBtn.textContent = 'Ukryj kamerę';
      } else {
        cameraElement.classList.add('hidden');
        toggleCameraBtn.textContent = 'Pokaż kamerę';
      }
    });
  </script>
</body>
</html>
